# Runs the published image from GitHub Container Registry and keeps the
# settings entered in the UI in a named volume, so they survive
# `docker compose down` / `up` and image upgrades.
#
#   docker compose up -d
#   ANALYTICS_TAG=0.2.0 docker compose up -d
#
# `docker compose down -v` also deletes the saved settings. Building from
# source is in compose.build.yaml.
name: allure-testops-cross-project-data

services:
  analytics:
    image: ghcr.io/cheshi-mantu/allure-testops-cross-project-data:${ANALYTICS_TAG:-latest}
    pull_policy: always
    container_name: allure-testops-cross-project-data
    restart: unless-stopped
    ports:
      - "${ANALYTICS_PORT:-8080}:8080"
    volumes:
      - analytics-data:/app/data

volumes:
  analytics-data:
